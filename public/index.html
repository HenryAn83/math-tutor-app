<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f6df5" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="수학쌤" />
  <title>수학쌤</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main id="app">
    <!-- 0. 입장 코드 -->
    <section id="screen-code" class="screen" hidden>
      <h1>수학쌤 <span class="wave">🔒</span></h1>
      <p class="lead">입장 코드를 넣어 줘.<br />한 번만 넣으면 이 폰이 기억해.</p>
      <form id="code-form" class="code-form">
        <input id="code-input" class="card" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="입장 코드" />
        <button class="btn primary big" type="submit">들어가기</button>
      </form>
    </section>

    <!-- 1. 시작 -->
    <section id="screen-home" class="screen" hidden>
      <h1>수학쌤 <span class="wave">👋</span></h1>
      <p class="lead">모르는 문제를 찍어서 올려 줘.<br />답 대신 질문으로 같이 풀어 볼게.</p>
      <label class="btn primary big">
        📷 문제 찍기
        <input id="input-camera" type="file" accept="image/*" capture="environment" hidden />
      </label>
      <label class="btn big">
        🖼️ 앨범에서 고르기
        <input id="input-album" type="file" accept="image/*" hidden />
      </label>
      <button id="btn-type" class="btn link">사진 말고 직접 쓸래</button>
      <button id="btn-history" class="btn" hidden>📚 지난 문제</button>
      <div class="tips">
        <b>잘 찍는 요령</b>
        <ul>
          <li>문제 하나만 화면 가득</li>
          <li>그림자 없이 밝은 곳에서</li>
          <li>종이를 똑바로, 흔들리지 않게</li>
        </ul>
      </div>
    </section>

    <!-- 2. 기다리기 -->
    <section id="screen-wait" class="screen" hidden>
      <div class="spinner"></div>
      <p id="wait-text" class="lead">사진 읽는 중…</p>
      <p id="wait-sub" class="sub"></p>
    </section>

    <!-- 3. 이렇게 읽었는데 맞아? -->
    <section id="screen-confirm" class="screen" hidden>
      <h2 id="confirm-title">이렇게 읽었는데 맞아?</h2>
      <div id="choice-list" class="choices" hidden></div>
      <div id="problem-view" class="card problem"></div>
      <p id="unclear-note" class="note" hidden></p>
      <textarea id="problem-edit" class="card" rows="7" hidden placeholder="문제를 그대로 적어 줘. 그림이 있으면 그림 내용도 (예: 각 B = 90°, AB = 6cm)"></textarea>
      <div class="row">
        <button id="btn-yes" class="btn primary">맞아, 시작!</button>
        <button id="btn-edit" class="btn">고칠게</button>
      </div>
      <button id="btn-retake" class="btn link">처음으로</button>
    </section>

    <!-- 4. 대화 -->
    <section id="screen-chat" class="screen chat" hidden>
      <header class="chat-head">
        <details>
          <summary>📄 오늘 문제 <span id="check-badge" class="badge"></span></summary>
          <div id="chat-problem" class="problem"></div>
        </details>
        <button id="btn-sound" class="btn small" hidden aria-pressed="false" title="선생님 말 읽어 주기">🔇</button>
        <button id="btn-new" class="btn small">새 문제</button>
      </header>
      <div id="messages" class="messages" aria-live="polite"></div>
      <div class="quick">
        <button data-quick="힌트 좀 줘">💡 힌트</button>
        <button data-quick="잘 모르겠어">🤔 모르겠어</button>
        <button data-quick="왜 그렇게 되는지 다시 설명해 줘">🔁 다시 설명</button>
      </div>
      <form id="chat-form" class="composer">
        <button id="btn-mic" class="btn mic" type="button" hidden aria-label="말로 하기">🎤</button>
        <textarea id="chat-input" rows="1" placeholder="생각을 적어 봐" enterkeyhint="send"></textarea>
        <button class="btn primary" type="submit">보내기</button>
      </form>
    </section>

    <!-- 5. 지난 문제 목록 -->
    <section id="screen-history" class="screen" hidden>
      <h2>📚 지난 문제</h2>
      <p class="sub">이 폰 안에만 저장돼. 사진은 저장하지 않아.</p>
      <div id="history-list" class="history-list"></div>
      <p id="history-empty" class="sub" hidden>아직 푼 문제가 없어.</p>
      <button id="btn-history-back" class="btn link">처음으로</button>
    </section>

    <!-- 6. 풀이 노트 -->
    <section id="screen-note" class="screen" hidden>
      <h2 id="note-title"></h2>
      <p id="note-date" class="sub"></p>
      <details class="card">
        <summary>📄 문제 보기</summary>
        <div id="note-problem" class="problem"></div>
      </details>
      <div class="card">
        <b>풀이 과정</b>
        <ol id="note-steps" class="note-steps"></ol>
        <div><b>답:</b> <span id="note-answer"></span></div>
      </div>
      <div class="card key"><b>💡 핵심</b><div id="note-key"></div></div>
      <div id="note-stuck-box" class="card stuck"><b>⚠️ 다음에 조심할 점</b><div id="note-stuck"></div></div>
      <button id="btn-note-back" class="btn">목록으로</button>
    </section>

    <div id="toast" class="toast" hidden></div>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
